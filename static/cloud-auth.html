<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkLab · 계정 연결</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css?v=0.2.0"><style>
body{display:grid;place-items:center;min-height:100vh;padding:30px}.auth-card{max-width:490px;width:100%;padding:35px;background:white;border:1px solid var(--line);border-radius:16px}.auth-card label{margin:18px 0 6px}.auth-card button{margin-top:12px;width:100%}.auth-card p{font-size:13px}.auth-card .brand{padding-bottom:20px}.auth-status{white-space:pre-line;color:#805d42;font-size:12px;line-height:1.8}#login-form{display:grid}#consent{margin-top:24px}#consent-details{white-space:pre-line;overflow-wrap:anywhere;background:var(--light);padding:15px;border-radius:8px;font-size:12px}
</style></head><body><section class="auth-card"><a class="brand" href="/"><span class="brandmark">i</span><b>inklab</b></a><h1 id="auth-title">나만의 작업 공간</h1><p id="auth-description">로그인하면 본인의 PDF와 필기 샘플만 열립니다.</p><form id="login-form"><label for="email">이메일</label><input id="email" type="email" required autocomplete="username"><label for="password">비밀번호</label><input id="password" type="password" required minlength="8" autocomplete="current-password"><button class="button primary" type="submit">로그인</button><button class="button" type="button" id="signup">계정 만들기</button></form><button id="github-login" class="button" hidden>GitHub 계정으로 로그인</button><div id="consent" hidden><h2>ChatGPT에 InkLab 연결</h2><div id="consent-details"></div><p>허용하면 이 앱이 내 PDF와 필기 샘플을 읽고, 필기를 등록하고, 새 PDF를 만들 수 있습니다. 다른 사용자의 자료에는 접근하지 않습니다.</p><button id="approve" class="button primary">내 작업 공간 연결 허용</button><button id="deny" class="button">연결 취소</button></div><p id="auth-status" class="auth-status" role="status"></p><p class="hint"><a href="/privacy.html">데이터 보관 안내</a></p></section><script type="module">import {authPage} from '/cloud-auth.js'; authPage();</script></body></html>
